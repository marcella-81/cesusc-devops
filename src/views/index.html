<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CESUSC DevOps</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #24292e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    .status {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Projeto DevOps</h1>
    <p>DEVOPS - Aplicação Node.js com Express</p>
  </header>

  <main>
    <div class="card">
      <h2>Aplicação em funcionamento</h2>
      <p class="status">Servidor rodando com sucesso!</p>
    </div>

  <footer>
    <p>Desenvolvido por Marcella :)</p>
  </footer>

</body>
</html>
